<template id="setupTpl">
 <div class="card"><h2>One-time setup (about 10 minutes, free)</h2>
 <ol>
  <li>Create a free account at <b>supabase.com</b> and make a <b>New project</b> (any name, choose a region near your players, save the database password somewhere).</li>
  <li>Open <b>SQL Editor → New query</b>, paste the code below, first <b>change <code>CHANGE-THIS-ADMIN-PASSWORD</code></b> to your own long admin password, then press <b>Run</b>. You should see "Success".</li>
  <li>Open <b>Project Settings → API</b>. Copy the <b>Project URL</b> and the <b>anon / publishable key</b>. (Never use the "service_role" / secret key.)</li>
  <li>Paste those two values into the <code>BACKEND</code> line near the top of the account script in <b>U1.html</b> (search for <code>FILL IN</code>), then host U1.html on a website (see the multiplayer steps).</li>
  <li>Already set up before? Press <b>COPY UPGRADE ONLY</b> and run it once in the SQL Editor to switch on the lifetime / yearly / monthly / daily / hourly graphs (it never touches your admin password).</li>
  <li>Host this V1Tracker.html on any free static host (Netlify Drop, Cloudflare Pages, GitHub Pages). Open it, enter the same URL + key and your admin password.</li>
 </ol>
 <div style="margin:12px 0 8px;display:flex;gap:8px"><button class="sm p" id="copySql">COPY SQL</button><button class="sm" id="copyUp">COPY UPGRADE ONLY (existing project)</button></div>
 <pre id="sqlBox"></pre></div>

<script>
const SQL="-- ===== FormulaR backend setup (run ONCE in Supabase: SQL Editor > New query > paste > Run) =====\n-- Before running: change CHANGE-THIS-ADMIN-PASSWORD below to your own long admin password.\ncreate extension if not exists pgcrypto with schema extensions;\n\ncreate table if not exists public.fr_users(\n  id uuid primary key default gen_random_uuid(),\n  username text unique not null,\n  display_name text not null,\n  email text not null,\n  pw text not null,\n  created_at timestamptz not null default now(),\n  last_login timestamptz,\n  logins int not null default 0,\n  last_seen timestamptz,\n  progress jsonb,\n  progress_updated timestamptz\n);\ncreate unique index if not exists fr_users_email_uq on public.fr_users (lower(email));\ncreate table if not exists public.fr_sessions(\n  token text primary key,\n  user_id uuid not null references public.fr_users(id) on delete cascade,\n  created_at timestamptz not null default now()\n);\ncreate table if not exists public.fr_counters(k text primary key, n bigint not null default 0);\ninsert into public.fr_counters(k,n) values ('guests',0) on conflict do nothing;\ncreate table if not exists public.fr_admin(id int primary key default 1, pw text not null);\ninsert into public.fr_admin(id,pw) values (1, extensions.crypt('CHANGE-THIS-ADMIN-PASSWORD', extensions.gen_salt('bf')))\n  on conflict (id) do update set pw = excluded.pw;\n\n-- Nobody can touch the tables directly; the game and tracker only use the functions below.\nalter table public.fr_users enable row level security;\nalter table public.fr_sessions enable row level security;\nalter table public.fr_counters enable row level security;\nalter table public.fr_admin enable row level security;\nrevoke all on public.fr_users, public.fr_sessions, public.fr_counters, public.fr_admin from anon, authenticated;\n\n-- internal helpers (not callable from the internet)\ncreate or replace function public.fr_uid(p_token text) returns uuid\nlanguage sql security definer set search_path = public, extensions as $$\n  select user_id from public.fr_sessions where token = p_token and created_at > now() - interval '90 days' limit 1\n$$;\ncreate or replace function public.fr_mk_session(p_uid uuid) returns text\nlanguage plpgsql security definer set search_path = public, extensions as $$\ndeclare v_t text := encode(gen_random_bytes(32),'hex');\nbegin\n  insert into public.fr_sessions(token,user_id) values (v_t,p_uid);\n  delete from public.fr_sessions where created_at < now() - interval '90 days';\n  return v_t;\nend $$;\ncreate or replace function public.fr_admin_ok(p_admin text) returns boolean\nlanguage plpgsql security definer set search_path = public, extensions as $$\ndeclare v_ok boolean;\nbegin\n  select (pw = extensions.crypt(coalesce(p_admin,''), pw)) into v_ok from public.fr_admin where id = 1;\n  if not coalesce(v_ok,false) then perform pg_sleep(0.6); end if;\n  return coalesce(v_ok,false);\nend $$;\nrevoke all on function public.fr_uid(text), public.fr_mk_session(uuid), public.fr_admin_ok(text) from public, anon, authenticated;\n\n-- ===== functions used by the game =====\ncreate or replace function public.fr_signup(p_user text, p_email text, p_hash text) returns json\nlanguage plpgsql security definer set search_path = public, extensions as $$\ndeclare v_u text := lower(trim(coalesce(p_user,''))); v_e text := trim(coalesce(p_email,'')); v_id uuid;\nbegin\n  if v_u !~ '^[a-z0-9_]{3,20}$' then return json_build_object('ok',false,'err','Username must be 3-20 letters, numbers or underscores.'); end if;\n  if v_e !~* '^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$' or length(v_e) > 120 then return json_build_object('ok',false,'err','Enter a valid email address.'); end if;\n  if coalesce(p_hash,'') !~ '^[0-9a-f]{64}$' then return json_build_object('ok',false,'err','Invalid password data.'); end if;\n  if exists (select 1 from public.fr_users where username = v_u) then return json_build_object('ok',false,'err','That username is already taken.'); end if;\n  if exists (select 1 from public.fr_users where lower(email) = lower(v_e)) then return json_build_object('ok',false,'err','That email is already registered.'); end if;\n  insert into public.fr_users(username,display_name,email,pw,last_login,logins,last_seen)\n    values (v_u, trim(p_user), v_e, extensions.crypt(p_hash, extensions.gen_salt('bf')), now(), 1, now()) returning id into v_id;\n  return json_build_object('ok',true,'token',public.fr_mk_session(v_id),'name',trim(p_user),'user',v_u);\nend $$;\n\ncreate or replace function public.fr_login(p_user text, p_hash text) returns json\nlanguage plpgsql security definer set search_path = public, extensions as $$\ndeclare r public.fr_users%rowtype;\nbegin\n  select * into r from public.fr_users where username = lower(trim(coalesce(p_user,'')));\n  if not found or r.pw <> extensions.crypt(coalesce(p_hash,''), r.pw) then\n    perform pg_sleep(0.6);\n    return json_build_object('ok',false,'err','Wrong username or password.');\n  end if;\n  update public.fr_users set last_login = now(), last_seen = now(), logins = logins + 1 where id = r.id;\n  return json_build_object('ok',true,'token',public.fr_mk_session(r.id),'name',r.display_name,'user',r.username,'progress',r.progress);\nend $$;\n\ncreate or replace function public.fr_save(p_token text, p_progress jsonb) returns json\nlanguage plpgsql security definer set search_path = public, extensions as $$\ndeclare v_uid uuid := public.fr_uid(p_token);\nbegin\n  if v_uid is null then return json_build_object('ok',false,'err','session'); end if;\n  if octet_length(p_progress::text) > 3000000 then return json_build_object('ok',false,'err','Progress data too large.'); end if;\n  update public.fr_users set progress = p_progress, progress_updated = now(), last_seen = now() where id = v_uid;\n  return json_build_object('ok',true);\nend $$;\n\ncreate or replace function public.fr_load(p_token text) returns json\nlanguage plpgsql security definer set search_path = public, extensions as $$\ndeclare v_uid uuid := public.fr_uid(p_token); v_p jsonb;\nbegin\n  if v_uid is null then return json_build_object('ok',false,'err','session'); end if;\n  select progress into v_p from public.fr_users where id = v_uid;\n  return json_build_object('ok',true,'progress',v_p);\nend $$;\n\ncreate or replace function public.fr_logout(p_token text) returns json\nlanguage plpgsql security definer set search_path = public, extensions as $$\nbegin\n  delete from public.fr_sessions where token = p_token;\n  return json_build_object('ok',true);\nend $$;\n\n-- guests: just a number going up by one, nothing else is stored\ncreate or replace function public.fr_guest() returns json\nlanguage plpgsql security definer set search_path = public, extensions as $$\nbegin\n  update public.fr_counters set n = n + 1 where k = 'guests';\n  return json_build_object('ok',true);\nend $$;\n\n-- ===== functions used by V1Tracker (need the admin password) =====\ncreate or replace function public.fr_admin_stats(p_admin text) returns json\nlanguage plpgsql security definer set search_path = public, extensions as $$\ndeclare v_g bigint; v_u json;\nbegin\n  if not public.fr_admin_ok(p_admin) then return json_build_object('ok',false,'err','Wrong admin password.'); end if;\n  select n into v_g from public.fr_counters where k = 'guests';\n  select coalesce(json_agg(x order by x.created_at desc),'[]'::json) into v_u from (\n    select username, display_name, email, created_at, last_login, logins, last_seen, progress_updated,\n           coalesce(octet_length(progress::text),0) as progress_bytes\n    from public.fr_users) x;\n  return json_build_object('ok',true,'guests',v_g,'users',v_u);\nend $$;\n\ncreate or replace function public.fr_admin_delete_user(p_admin text, p_user text) returns json\nlanguage plpgsql security definer set search_path = public, extensions as $$\nbegin\n  if not public.fr_admin_ok(p_admin) then return json_build_object('ok',false,'err','Wrong admin password.'); end if;\n  delete from public.fr_users where username = lower(trim(p_user));\n  return json_build_object('ok',true);\nend $$;\n\ncreate or replace function public.fr_admin_reset_pw(p_admin text, p_user text, p_hash text) returns json\nlanguage plpgsql security definer set search_path = public, extensions as $$\ndeclare v_id uuid;\nbegin\n  if not public.fr_admin_ok(p_admin) then return json_build_object('ok',false,'err','Wrong admin password.'); end if;\n  if coalesce(p_hash,'') !~ '^[0-9a-f]{64}$' then return json_build_object('ok',false,'err','Invalid password data.'); end if;\n  update public.fr_users set pw = extensions.crypt(p_hash, extensions.gen_salt('bf')) where username = lower(trim(p_user)) returning id into v_id;\n  if v_id is null then return json_build_object('ok',false,'err','No such user.'); end if;\n  delete from public.fr_sessions where user_id = v_id;\n  return json_build_object('ok',true);\nend $$;\n\n-- allow the public website key to call only the intended functions\nrevoke all on function public.fr_signup(text,text,text), public.fr_login(text,text), public.fr_save(text,jsonb), public.fr_load(text),\n  public.fr_logout(text), public.fr_guest(), public.fr_admin_stats(text), public.fr_admin_delete_user(text,text),\n  public.fr_admin_reset_pw(text,text,text) from public;\ngrant execute on function public.fr_signup(text,text,text), public.fr_login(text,text), public.fr_save(text,jsonb), public.fr_load(text),\n  public.fr_logout(text), public.fr_guest(), public.fr_admin_stats(text), public.fr_admin_delete_user(text,text),\n  public.fr_admin_reset_pw(text,text,text) to anon;\n";
const $=i=>document.getElementById(i),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let CFG={url:'',key:''},ADMIN='',DATA=null,sortK='created_at',sortD=-1,timer=null;
try{const c=JSON.parse(localStorage.getItem('v1t_cfg')||'{}');$('cUrl').value=c.url||$('cUrl').value;$('cKey').value=c.key||$('cKey').value}catch(e){}
async function rpc(fn,args){const h={'Content-Type':'application/json',apikey:CFG.key};if(/^eyJ/.test(CFG.key))h.Authorization='Bearer '+CFG.key;
 const r=await fetch(CFG.url.replace(/\/+$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(args)});if(!r.ok)throw new Error('Server error '+r.status+' — did the SQL setup finish?');return r.json()}
async function hashPw(user,pw){const enc=new TextEncoder(),km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
 const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:enc.encode('formularr:v1:'+user.trim().toLowerCase()),iterations:120000},km,256);return[...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('')}
function showSetup(){$('setup').innerHTML=$('setupTpl').innerHTML;$('sqlBox').textContent=SQL+'\n'+UP;$('copySql').onclick=e=>cp(e.target,SQL+'\n'+UP);$('copyUp').onclick=e=>cp(e.target,UP)}
$('setupBtn').onclick=()=>{$('loginView').classList.add('hide');$('appView').classList.remove('hide');tab(2)};
function tab(n){$('t1').classList.toggle('on',n==1);$('t2').classList.toggle('on',n==2);$('dash').classList.toggle('hide',n!=1);$('setup').classList.toggle('hide',n!=2);if(n==2)showSetup();if(!ADMIN&&n==2){$('outBtn').textContent='BACK'}}
$('t1').onclick=()=>{if(ADMIN)tab(1)};$('t2').onclick=()=>tab(2);
$('outBtn').onclick=()=>{ADMIN='';DATA=null;clearInterval(timer);$('appView').classList.add('hide');$('loginView').classList.remove('hide');$('cPw').value='';$('outBtn').textContent='LOCK';$('lMsg').textContent=''};
$('goBtn').onclick=login;$('cPw').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
async function login(){CFG={url:$('cUrl').value.trim(),key:$('cKey').value.trim()};const m=$('lMsg');m.className='msg';
 if(!CFG.url||!CFG.key||!$('cPw').value){m.textContent='Fill in all three fields.';m.className='msg bad';return}
 m.textContent='Connecting…';ADMIN=$('cPw').value;
 try{const r=await rpc('fr_admin_stats',{p_admin:ADMIN});if(!r.ok){ADMIN='';m.textContent=r.err||'Login failed.';m.className='msg bad';return}

create or replace function public.fr_search(p_token text, p_q text) returns json
language plpgsql security definer set search_path = public, extensions as $$
declare v_uid uuid := public.fr_uid(p_token); v_q text := lower(regexp_replace(coalesce(p_q,''),'[^A-Za-z0-9_]','','g')); v_l text; v_r json;
begin
  if v_uid is null then return json_build_object('ok',false,'err','session'); end if;
  if length(v_q) < 1 then return json_build_object('ok',true,'users','[]'::json); end if;
  v_l := replace(v_q,'_','\_');
  select coalesce(json_agg(r),'[]'::json) into v_r from (
    select u.username, u.display_name as name, public.fr_active_titles(u.titles,u.title_exp) as titles,
      coalesce(u.last_seen > now() - interval '45 seconds', false) as online,
      case when f.status = 'accepted' then 'friend' when f.status = 'pending' and f.req = v_uid then 'sent' when f.status = 'pending' then 'received' else null end as rel
    from public.fr_users u
    left join public.fr_friends f on f.a = least(u.id, v_uid) and f.b = greatest(u.id, v_uid)
    where u.id <> v_uid and (u.username like v_l || '%' or u.username like '%' || v_l || '%' or (length(v_q) >= 3 and similarity(u.username, v_q) > 0.2))
    order by (u.username = v_q) desc, (u.username like v_l || '%') desc, similarity(u.username, v_q) desc, u.username
    limit 8) r;
  return json_build_object('ok',true,'users',v_r);
end $$;

create or replace function public.fr_friend_request(p_token text, p_user text) returns json
language plpgsql security definer set search_path = public, extensions as $$
declare v_uid uuid := public.fr_uid(p_token); v_t uuid; f public.fr_friends%rowtype;
begin
  if v_uid is null then return json_build_object('ok',false,'err','session'); end if;
  select id into v_t from public.fr_users where username = lower(trim(coalesce(p_user,'')));
  if v_t is null then return json_build_object('ok',false,'err','No such player.'); end if;
  if v_t = v_uid then return json_build_object('ok',false,'err','You cannot add yourself.'); end if;
  select * into f from public.fr_friends where a = least(v_t,v_uid) and b = greatest(v_t,v_uid);
  if not found and (select count(*) from public.fr_friends where status = 'pending' and req = v_uid) >= 50 then return json_build_object('ok',false,'err','Too many pending requests.'); end if;
  if found then
    if f.status = 'accepted' then return json_build_object('ok',false,'err','Already friends.'); end if;
    if f.req = v_uid then return json_build_object('ok',false,'err','Request already sent.'); end if;
    update public.fr_friends set status = 'accepted' where a = f.a and b = f.b;
    return json_build_object('ok',true,'status','accepted');
  end if;
  insert into public.fr_friends(a,b,req) values (least(v_t,v_uid), greatest(v_t,v_uid), v_uid);
  return json_build_object('ok',true,'status','sent');
end $$;

create or replace function public.fr_friend_respond(p_token text, p_user text, p_accept boolean) returns json
language plpgsql security definer set search_path = public, extensions as $$
declare v_uid uuid := public.fr_uid(p_token); v_t uuid;
begin
  if v_uid is null then return json_build_object('ok',false,'err','session'); end if;
  select id into v_t from public.fr_users where username = lower(trim(coalesce(p_user,'')));
  if v_t is null then return json_build_object('ok',false,'err','No such player.'); end if;
  if p_accept then
    update public.fr_friends set status = 'accepted' where a = least(v_t,v_uid) and b = greatest(v_t,v_uid) and status = 'pending' and req <> v_uid;
  else
    delete from public.fr_friends where a = least(v_t,v_uid) and b = greatest(v_t,v_uid) and status = 'pending' and req <> v_uid;
  end if;
  return json_build_object('ok',true);
end $$;

create or replace function public.fr_friend_remove(p_token text, p_user text) returns json

create or replace function public.fr_friend_list(p_token text) returns json
language plpgsql security definer set search_path = public, extensions as $$
declare v_uid uuid := public.fr_uid(p_token); v_f json; v_i json; v_o json;
begin
  if v_uid is null then return json_build_object('ok',false,'err','session'); end if;
  select coalesce(json_agg(x order by x.online desc, x.name),'[]'::json) into v_f from (
    select u.username, u.display_name as name, public.fr_active_titles(u.titles,u.title_exp) as titles,
      coalesce(u.last_seen > now() - interval '45 seconds', false) as online,
      case when u.last_seen > now() - interval '45 seconds' then u.presence ->> 'room' end as room,
      coalesce((u.presence ->> 'racing')::boolean,false) as racing
    from public.fr_friends f join public.fr_users u on u.id = case when f.a = v_uid then f.b else f.a end
    where f.status = 'accepted' and v_uid in (f.a,f.b)) x;
  select coalesce(json_agg(x order by x.name),'[]'::json) into v_i from (
    select u.username, u.display_name as name, public.fr_active_titles(u.titles,u.title_exp) as titles,
      coalesce(u.last_seen > now() - interval '45 seconds', false) as online
    from public.fr_friends f join public.fr_users u on u.id = case when f.a = v_uid then f.b else f.a end
    where f.status = 'pending' and f.req <> v_uid and v_uid in (f.a,f.b)) x;
  select coalesce(json_agg(x order by x.name),'[]'::json) into v_o from (
    select u.username, u.display_name as name, public.fr_active_titles(u.titles,u.title_exp) as titles,
      coalesce(u.last_seen > now() - interval '45 seconds', false) as online
    from public.fr_friends f join public.fr_users u on u.id = case when f.a = v_uid then f.b else f.a end
    where f.status = 'pending' and f.req = v_uid and v_uid in (f.a,f.b)) x;
  return json_build_object('ok',true,'friends',v_f,'incoming',v_i,'outgoing',v_o);
end $$;

create or replace function public.fr_invite(p_token text, p_user text, p_room text) returns json
language plpgsql security definer set search_path = public, extensions as $$
declare v_uid uuid := public.fr_uid(p_token); v_t uuid;

   where u.username = lower(trim(coalesce(p_user,''))) and u.id <> v_uid;

  insert into public.fr_invites(to_uid,from_uid,room) values (v_t,v_uid,p_room);

end $$;

  <h2 style="margin-top:16px">Fastest times by track</h2>${T.length?`<div class="tw"><table><thead><tr><th>Track</th><th>Fastest lap</th><th>Best quali</th><th>Poles</th><th>Wins</th><th>Podiums</th><th>Races</th><th>Laps led</th></tr></thead><tbody>${T.map(t=>`<tr><td>${esc(t.n)}</td><td>${tf(t.best)}</td><td>${tf(t.bestQ)}</td><td>${t.poles|0}</td><td>${t.wins|0}</td><td>${t.podiums|0}</td><td>${t.races|0}</td><td>${t.lapsLed|0}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No laps recorded yet.</div>'}`;
  $('pvX').onclick=()=>pv.classList.remove('open')}
 catch(e){const miss=/404|400|Server error/.test(e.message);body.innerHTML=`<div class="ph"><h2 style="margin:0">Profile</h2><span class="sp"></span>${close}</div><div class="msg bad">${esc(miss?'Could not load. Run the UPGRADE SQL once (Setup guide → COPY UPGRADE ONLY) to enable player profiles.':e.message)}</div>`;$('pvX').onclick=()=>pv.classList.remove('open')}}
$('pv').addEventListener('click',e=>{if(e.target.id==='pv')$('pv').classList.remove('open')});
async function act(a,u){if(a==='prof')return showProfile(u);if(a==='gift')return showGift(u);try{if(a==='del'){if(!confirm('Permanently delete account "'+u+'" and its saved progress?'))return;const r=await rpc('fr_admin_delete_user',{p_admin:ADMIN,p_user:u});if(!r.ok)throw new Error(r.err)}
 else{const p=prompt('New password for "'+u+'" (at least 8 characters). You will have to tell the player.');if(!p)return;if(p.length<8)return alert('At least 8 characters.');const r=await rpc('fr_admin_reset_pw',{p_admin:ADMIN,p_user:u,p_hash:await hashPw(u,p)});if(!r.ok)throw new Error(r.err);alert('Password changed. The player is logged out everywhere.')}
 refresh()}catch(e){alert(e.message||'Failed')}}
$('csvBtn').onclick=()=>{if(!DATA)return;const c=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"',h=['username','email','created_at','last_login','logins','progress_updated','progress_bytes','titles'];
 const t=[h.join(',')].concat(DATA.users.map(x=>h.map(k=>c(k=='titles'?(x.titles||[]).join('|'):x[k])).join(','))).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='formular-accounts.csv';a.click()};
